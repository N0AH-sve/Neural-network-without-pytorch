[project]
name = "my-torch"
version = "0.1.0"
description = "my_torch - a from-scratch neural network module and chessboard analyzer"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
]

[project.scripts]
my_torch_analyzer = "my_torch.analyser.analyzer:main"
my_torch_generator = "my_torch.generator.generator:main"

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/my_torch"]
